<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>PencilVid — Brief maintenance</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f7ff; color: #070b18; font-family: Inter, Arial, sans-serif; }
      main { width: min(620px, 100%); padding: clamp(28px, 6vw, 58px); background: white; border: 5px solid #070b18; box-shadow: 12px 12px 0 #2563eb; }
      .tag { display: inline-block; padding: 7px 11px; background: #070b18; color: white; font: 800 12px/1 monospace; letter-spacing: .12em; text-transform: uppercase; transform: rotate(-1deg); }
      h1 { margin: 28px 0 16px; font-size: clamp(36px, 8vw, 70px); line-height: .95; letter-spacing: -.055em; text-wrap: balance; }
      p { max-width: 48ch; margin: 0; color: #475569; font-size: 17px; line-height: 1.65; }
      .status { display: flex; align-items: center; gap: 10px; margin-top: 30px; font: 700 13px/1.3 monospace; text-transform: uppercase; }
      .dot { width: 11px; height: 11px; background: #2563eb; border: 2px solid #070b18; border-radius: 50%; animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 50% { transform: scale(.55); opacity: .55; } }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <span class="tag">Explainora update</span>
      <h1>Sharpening<br />the pencils.</h1>
      <p>We’re applying a short, planned update. Your account and existing videos remain safe. Please try again in a few minutes.</p>
      <div class="status"><span class="dot"></span>Maintenance in progress</div>
    </main>
  </body>
</html>
